<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Ẩm Thực Việt Nam</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <a class="skip-link" href="#main-content">Chuyển đến Nội dung chính</a>

    <header>
        <nav class="navbar">
            <div class="logo">Ẩm Thực Việt</div>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="recipes.html">Món ngon 3 miền</a></li>
                <li><a href="contact.html" class="active">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section class="contact-container">
            <div class="contact-info">
                <h1>Gửi Công Thức Món Ngon</h1>
                <p>Bạn có công thức gia truyền hoặc muốn đóng góp ý kiến về ẩm thực Việt? Hãy gửi tin nhắn cho chúng tôi!</p>
                <img src="phòng bếp.jpg" alt="Không gian góc bếp tươi sáng với các nguyên liệu nấu ăn">
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Họ và tên:</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Nhập họ và tên của bạn">
                </div>

                <div class="form-group">
                    <label for="email">Địa chỉ Email:</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="region">Vùng miền món ăn:</label>
                    <select id="region" name="region">
                        <option value="north">Miền Bắc</option>
                        <option value="central">Miền Trung</option>
                        <option value="south">Miền Nam</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Nội dung / Công thức:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Chia sẻ công thức hoặc ý kiến của bạn..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Gửi Đóng Góp</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Khám Phá Ẩm Thực Việt Nam. Tất cả quyền được bảo lưu.</p>
    </footer>

</body>
</html>
